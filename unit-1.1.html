<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }
    .wrap {
      text-align: center;
      position: relative;
    }
    img {
      max-width: 300px;
      filter: grayscale(100%);
    }
    .bubble {
      position: absolute;
      top: 10px;
      left: -40px;
      background: #fff;
      border: 3px solid #000;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
    }
    .bubble:after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 40px;
      border-width: 15px 10px 0;
      border-style: solid;
      border-color: #000 transparent transparent transparent;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bubble">I didn’t build it yet...</div>
    <img src="placeholder.png" alt="coming soon" />
  </div>
</body>
</html>
